# Lint, types, unit and end-to-end tests on every PR. Not again on main after a
# merge: the PR already ran them.
name: Checks
on:
  pull_request:

# A new push to a PR cancels its run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # Headless shell only: the tests never use full Chromium.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: cp .dev.vars.example .dev.vars
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
