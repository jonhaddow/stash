# Weekly dependency updates, opened on Friday so they're ready for the
# Saturday PR review. Minor and patch updates come as one grouped PR; each
# major update gets its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7.0 fails npm ci: svelte-check and typescript-eslint only
      # accept TypeScript up to 6. Skip 7.0.x only, so 7.1 still gets a PR.
      - dependency-name: typescript
        versions:
          - '7.0.x'
